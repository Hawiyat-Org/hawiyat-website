name: CI

on:
  push:
    branches: [main]
  pull_request:

# The disposable-domain blocklist is a security control, and the app builds with
# typescript.ignoreBuildErrors + eslint.ignoreDuringBuilds. Without this workflow
# an empty or malformed blocklist would deploy green and silently stop blocking.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from package.json's "packageManager" field; setting it
        # here as well can conflict.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Prisma needs a URL at generate/build time; no database is contacted.
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci
