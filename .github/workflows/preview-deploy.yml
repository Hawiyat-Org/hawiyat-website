name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Build OpenNext.js Cloudflare worker
        run: pnpm exec opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion

      - name: Compute preview slug
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          slug=$(echo "${PR_HEAD_REF}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-40)
          echo "slug=${slug}" >> "$GITHUB_ENV"

      - name: Deploy preview worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --name "hawiyat-preview-$slug"

      - name: Set DATABASE_URL worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.DATABASE_URL }}" | pnpm exec wrangler secret put DATABASE_URL --name "hawiyat-preview-$slug"

      - name: Set GEMINI_API_KEY worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.GEMINI_API_KEY }}" | pnpm exec wrangler secret put GEMINI_API_KEY --name "hawiyat-preview-$slug"

      - name: Set SMTP_HOST worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.SMTP_HOST }}" | pnpm exec wrangler secret put SMTP_HOST --name "hawiyat-preview-$slug"

      - name: Set SMTP_PORT worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.SMTP_PORT }}" | pnpm exec wrangler secret put SMTP_PORT --name "hawiyat-preview-$slug"

      - name: Set SMTP_USER worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.SMTP_USER }}" | pnpm exec wrangler secret put SMTP_USER --name "hawiyat-preview-$slug"

      - name: Set SMTP_PASS worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.SMTP_PASS }}" | pnpm exec wrangler secret put SMTP_PASS --name "hawiyat-preview-$slug"

      - name: Set EMAIL_FROM worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.EMAIL_FROM }}" | pnpm exec wrangler secret put EMAIL_FROM --name "hawiyat-preview-$slug"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          SLUG: ${{ env.slug }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview ready: https://${process.env.SLUG}.preview.hawiyat.org`,
            })

  teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute preview slug
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          slug=$(echo "${PR_HEAD_REF}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-40)
          echo "slug=${slug}" >> "$GITHUB_ENV"

      - name: Delete preview worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler delete --name "hawiyat-preview-$slug" || true
