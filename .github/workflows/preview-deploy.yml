name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Build OpenNext.js Cloudflare worker
        run: pnpm exec opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion

      - name: Compute preview slug
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          slug=$(echo "${PR_HEAD_REF}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-40)
          if [ -z "$slug" ]; then slug="branch"; fi
          if [ "$slug" = "router" ]; then slug="router-branch"; fi
          echo "slug=${slug}" >> "$GITHUB_ENV"

      - name: Deploy preview worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --name "hawiyat-preview-$slug"

      - name: Set DATABASE_URL worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: printf '%s' "$DATABASE_URL" | pnpm exec wrangler secret put DATABASE_URL --name "hawiyat-preview-$slug"

      - name: Set GEMINI_API_KEY worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: printf '%s' "$GEMINI_API_KEY" | pnpm exec wrangler secret put GEMINI_API_KEY --name "hawiyat-preview-$slug"

      - name: Set SMTP_HOST worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
        run: printf '%s' "$SMTP_HOST" | pnpm exec wrangler secret put SMTP_HOST --name "hawiyat-preview-$slug"

      - name: Set SMTP_PORT worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: printf '%s' "$SMTP_PORT" | pnpm exec wrangler secret put SMTP_PORT --name "hawiyat-preview-$slug"

      - name: Set SMTP_SECURE worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
        run: printf '%s' "$SMTP_SECURE" | pnpm exec wrangler secret put SMTP_SECURE --name "hawiyat-preview-$slug"

      - name: Set SMTP_USER worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
        run: printf '%s' "$SMTP_USER" | pnpm exec wrangler secret put SMTP_USER --name "hawiyat-preview-$slug"

      - name: Set SMTP_PASS worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: printf '%s' "$SMTP_PASS" | pnpm exec wrangler secret put SMTP_PASS --name "hawiyat-preview-$slug"

      - name: Set SMTP_FROM worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: printf '%s' "$SMTP_FROM" | pnpm exec wrangler secret put SMTP_FROM --name "hawiyat-preview-$slug"

      - name: Set TELEGRAM_BOT_TOKEN worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: printf '%s' "$TELEGRAM_BOT_TOKEN" | pnpm exec wrangler secret put TELEGRAM_BOT_TOKEN --name "hawiyat-preview-$slug"

      - name: Set TELEGRAM_CHAT_ID worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: printf '%s' "$TELEGRAM_CHAT_ID" | pnpm exec wrangler secret put TELEGRAM_CHAT_ID --name "hawiyat-preview-$slug"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          SLUG: ${{ env.slug }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const slug = process.env.SLUG;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview ready: https://hawiyat-preview-${slug}.shmsaldynbwbst.workers.dev\nBranded URL (once wildcard DNS exists): https://${slug}.preview.hawiyat.org`,
            })

  teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute preview slug
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          slug=$(echo "${PR_HEAD_REF}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-40)
          if [ -z "$slug" ]; then slug="branch"; fi
          if [ "$slug" = "router" ]; then slug="router-branch"; fi
          echo "slug=${slug}" >> "$GITHUB_ENV"

      - name: Delete preview worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler delete --name "hawiyat-preview-$slug" || true
